<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Анимации — Практическая работа №5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Демонстрация CSS-анимаций</h1>

    <section>
        <h2>1. Кнопка с эффектом наведения</h2>
        <button class="btn">Наведи на меня</button>
    </section>

    <section>
        <h2>2. Блок с увеличением</h2>
        <div class="box">Блок</div>
    </section>

    <section>
        <h2>3. Мигающий текст</h2>
        <p class="text">Мигающий текст</p>
    </section>

    <section>
        <h2>4. Вращающийся круг</h2>
        <div class="circle"></div>
    </section>

    <section>
        <h2>5. Пульсирующий элемент</h2>
        <div class="pulse"></div>
    </section>

    <section>
        <h2>6. Плавное появление</h2>
        <div class="fade-in">Я плавно появился</div>
    </section>

</body>
</html>
